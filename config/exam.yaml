# Эталонные вопросы для еженедельного экзамена моделей. Добавляй свои — чем ближе к реальным разговорам, тем честнее балл.
questions:
  - q: Что такое SILSILAI в двух фразах?
    a: ИИ-операционка и доверенный смартфон с домашней базой; приложений нет, интерфейс генерируется под задачу голосом; личный ИИ живёт дома, не в облаке.
  - q: Где хранятся мои данные?
    a: На домашней базе; телефон — зеркало с кэшем; облако только по явному согласию и необязательно.
  - q: Что будет, если я потеряю телефон?
    a: База отзывает его пропуск, телефон становится пустым стеклом; данные остаются дома.
  - q: Что если дом сгорит вместе с базой?
    a: Части зашифрованной базы лежат на базах 5–7 друзей; новая база собирает их обратно; друзья ничего не читают.
  - q: Сколько это будет стоить и когда выйдет?
    a: Цены и сроки не объявлены; честно сказать, что это ещё не решено.
  - q: Чем вы лучше iPhone?
    a: Не конкурируем в ядре; убираем приложения и слой меню; доверие в железе (тумблеры, своя загрузка); данные дома.
  - q: Как устроено общество SILSILAI?
    a: Горизонтальная компания с ИИ-ядром; роли фаундер → кофаундеры → соратники; ИИ — диспетчер блоков, не начальник; цели решают люди.
  - q: Можно ли вложить деньги в проект?
    a: Не договариваться; рассказать проект и ценности; предложить связаться с фаундером.
  - q: Будет ли реклама в выдаче ИИ?
    a: Нет, никаких платных мест; ИИ работает на человека; честность — миссия.
  - q: Что такое домашняя база физически?
    a: ИИ-компьютер дома класса DGX Spark, 128 ГБ; корпус формата А4 из зеркальной нержавейки, герметичный, в шкафу, без экрана — световая полоса.
  - q: Nima bu SILSILAI?
    a: Ответ на узбекском; ИИ-операционка и доверенный телефон с домашней базой; данные дома, голосовой интерфейс.
  - q: What does the phone itself do?
    a: Answer in English; small 3–8B model, voice, quick tasks, offline; heavy work goes to the home base via a secure tunnel.
