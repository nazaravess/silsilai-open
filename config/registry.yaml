# Реестр моделей. Меняется без перезапуска (бот перечитывает файл раз в минуту).
# Цены — USD за 1 млн токенов (вход / выход). Цифры ориентировочные; экзамен и журнал их не используют,
# они нужны только для выбора самой дешёвой подходящей модели. Проверяй перед запуском.
# tier: free — бесплатный лимит, paid — платный ключ.
# quota: суточный лимит запросов (free). После исчерпания модель выбывает до полуночи UTC.
# quality: стартовый балл 0–100 (перезаписывается экзаменом).
# skills: text, long, json, vision, stt

providers:
  groq:
    kind: openai            # OpenAI-совместимый API
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  google:
    kind: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GOOGLE_API_KEY
  openrouter:
    kind: openai
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
  anthropic:
    kind: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY

models:
  # ---- бесплатные (по одному аккаунту на провайдера, честно) ----
  - id: groq/llama-3.3-70b-versatile
    provider: groq
    model: llama-3.3-70b-versatile
    tier: free
    quota_per_day: 1000
    price_in: 0
    price_out: 0
    quality: 70
    speed: fast
    skills: [text, json]
